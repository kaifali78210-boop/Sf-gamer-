<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">

<title>SF Gamer — Cheat Codes</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0b12;color:#f8fafc;font-family:Arial,sans-serif}
header{text-align:center;padding:22px 12px;background:linear-gradient(135deg,#17172a,#242044);border-bottom:1px solid #34344b}
h1{margin:0;font-size:32px}header p{margin:8px 0 0;color:#c7c7d9}
main{max-width:900px;margin:auto;padding:16px}

.note{font-size:13px;line-height:1.5;color:#f5d98a;background:#28210e;border:1px solid #57451b;padding:12px;border-radius:10px;margin:12px 0}
.tabs{display:flex;gap:8px;margin:18px 0 12px;overflow-x:auto}

.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{padding:16px 8px;text-align:center;background:#191925;border:1px solid #303044;border-radius:12px}
.code{font-size:23px;font-weight:800;overflow-wrap:anywhere}.label{margin-top:6px;color:#a5a5bb;font-size:12px}
footer{text-align:center;padding:24px;color:#77778e;font-size:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
